name: DEBUG - bulk ohlc lookup

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/moneydj-concept-scraper-igtou1
    paths:
      - ".github/workflows/debug-bulk-ohlc.yml"
      - "moneydj-scraper/debug_bulk_ohlc.py"
      - "moneydj-scraper/fetch_universe_detail.py"
      - "moneydj-scraper/twse_api.py"

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: moneydj-scraper
        run: pip install -r requirements.txt
      - name: Run full universe detail backfill (dry run, no commit)
        working-directory: moneydj-scraper
        run: |
          time python fetch_universe_detail.py
          echo "--- file size ---"
          ls -lh universe_detail.json
          du -h universe_detail.json
          echo "--- sample record (2330) ---"
          python3 -c "
import json
d = json.load(open('universe_detail.json', encoding='utf-8'))
print('total stocks:', len(d))
r = d.get('2330', {})
print('2330 ohlc rows:', len(r.get('ohlc', [])))
print('2330 institutional rows:', len(r.get('institutional', [])))
print('2330 margin rows:', len(r.get('margin', [])))
print('2330 fundamentals:', r.get('fundamentals'))
print('2330 insights:', r.get('insights'))
got_ohlc = sum(1 for v in d.values() if v.get('ohlc'))
print('stocks with any ohlc:', got_ohlc, '/', len(d))
"
      - uses: actions/upload-artifact@v4
        with:
          name: universe-detail-dry-run
          path: moneydj-scraper/universe_detail.json
