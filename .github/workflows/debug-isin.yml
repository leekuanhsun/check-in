name: DEBUG - isin lookup

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run debug script
        working-directory: moneydj-scraper
        run: python debug_isin.py
