name: Fetch real TWSE concept-stock data

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/moneydj-concept-scraper-igtou1
    paths:
      - ".github/workflows/fetch-real-twse-data.yml"
      - "moneydj-scraper/fetch_real_data.py"
      - "moneydj-scraper/twse_api.py"
      - "moneydj-scraper/insights.py"
      - "moneydj-scraper/models.py"
      - "moneydj-scraper/requirements.txt"
      - "moneydj-scraper/debug_endpoints.py"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: moneydj-scraper
        run: pip install -r requirements.txt

      - name: Debug raw TWSE endpoint shapes
        working-directory: moneydj-scraper
        run: python debug_endpoints.py

      - name: Fetch real data from TWSE
        working-directory: moneydj-scraper
        run: python fetch_real_data.py

      - uses: actions/upload-artifact@v4
        with:
          name: real-twse-data
          path: |
            moneydj-scraper/real_concept_stocks.json
            moneydj-scraper/real_concept_detail.json

      - name: Commit results back to the branch
        working-directory: moneydj-scraper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add real_concept_stocks.json real_concept_detail.json
          git diff --cached --quiet || git commit -m "Update real TWSE concept-stock data [skip ci]"
          git push
