name: Fetch full TWSE universe (all stocks + industry)

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/moneydj-concept-scraper-igtou1
    paths:
      - ".github/workflows/fetch-universe-data.yml"
      - "moneydj-scraper/fetch_universe.py"
      - "moneydj-scraper/debug_universe_endpoints.py"
      - "moneydj-scraper/concept_categories.py"
      - "moneydj-scraper/twse_api.py"
      - "moneydj-scraper/models.py"
      - "moneydj-scraper/requirements.txt"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: moneydj-scraper
        run: pip install -r requirements.txt

      - name: Debug raw universe endpoint shapes
        working-directory: moneydj-scraper
        run: python debug_universe_endpoints.py

      - name: Fetch full TWSE universe
        working-directory: moneydj-scraper
        run: python fetch_universe.py

      - uses: actions/upload-artifact@v4
        with:
          name: universe-data
          path: moneydj-scraper/universe_stocks.json

      - name: Commit results back to the branch
        working-directory: moneydj-scraper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add universe_stocks.json
          git diff --cached --quiet && exit 0
          git commit -m "Update full TWSE universe snapshot [skip ci]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, rebasing onto latest remote (attempt $i)..."
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            sleep $((i * 2))
          done
          git push
