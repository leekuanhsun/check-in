  --bad-tint:#33201d;

  --band-400:#c99257; --band-400-tint:#3a2a17; --band-400-ink:#f0d9b8;
  --band-600:#7bb488; --band-600-tint:#1f3223; --band-600-ink:#d3ecd9;
  --band-800:#7ba7d6; --band-800-tint:#1c2c3d; --band-800-ink:#cfe1f4;
  --band-990:#dcaa4c; --band-990-tint:#3a2e11; --band-990-ink:#f4e2b4;
  color-scheme: dark;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;}
p{margin:0;}
button{font-family:inherit;}
::selection{background:var(--accent);color:var(--card);}

.stage{
  min-height:100vh;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:0;
  position:relative;
}
.deck-shadow{
  display:none;
  position:absolute;
  top:32px;
  width:428px;
  height:calc(100vh - 64px);
  max-height:900px;
  border-radius:22px;
  background:var(--accent-tint);
  border:1px solid var(--line);
}
.deck-shadow--1{ transform:rotate(-2.4deg) translateX(-2px); opacity:.9;}
.deck-shadow--2{ transform:rotate(3.1deg) translateX(4px); opacity:.6;}

.app{
  width:100%;
  max-width:428px;
  min-height:100vh;
  background:var(--card);
  display:flex;
  flex-direction:column;
  position:relative;
}

@media (min-width:640px){
  .stage{padding:32px 16px;}
  .deck-shadow{display:block;}
  .app{
    min-height:calc(100vh - 64px);
    max-height:900px;
    border-radius:22px;
    box-shadow:0 24px 48px -12px var(--shadow), 0 1px 0 var(--line);
    overflow:hidden;
    border:1px solid var(--line);
  }
}

.topbar{
  display:flex;
  align-items:center;
  gap:10px;
  padding:16px 18px 14px;
  border-bottom:1px solid var(--line-soft);
  flex:none;
  background:var(--card);
  position:sticky;
  top:0;
  z-index:5;
}
.topbar .spacer{flex:1;}
.iconbtn{
  width:36px;height:36px;
  border-radius:10px;
  border:1px solid var(--line);
  background:var(--card-alt);
  color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  flex:none;
}
.iconbtn:active{transform:scale(0.94);}
.iconbtn svg{width:18px;height:18px;}
.topbar-title{
  font-family:var(--font-display);
  font-weight:600;
  font-size:1.05rem;
}
.topbar-sub{
  font-family:var(--font-mono);
  font-size:.72rem;
  color:var(--ink-faint);
  letter-spacing:.02em;
}

.screen{
  flex:1;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.screen::-webkit-scrollbar{width:0;}

.pad{padding:18px;}

/* ---------- Home ---------- */
.home-hero{
  padding:22px 20px 6px;
}
.home-kicker{
  font-family:var(--font-mono);
  font-size:.72rem;
  letter-spacing:.08em;
  color:var(--ink-faint);
  text-transform:uppercase;
}
.home-title{
  font-size:1.7rem;
  font-weight:700;
  margin-top:6px;
}
.home-desc{
  margin-top:8px;
  font-size:.88rem;
  color:var(--ink-soft);
  line-height:1.6;
  max-width:34ch;
}

.band-list{
  display:flex;
  flex-direction:column;
  gap:12px;
  padding:16px 18px 24px;
}
.band-tile{
  position:relative;
  display:flex;
  align-items:center;
  gap:14px;
  background:var(--card-alt);
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px 16px 14px 18px;
  cursor:pointer;
  text-align:left;
  color:inherit;
  overflow:hidden;
}
.band-tile::before{
  content:"";
  position:absolute;
  left:0;top:0;bottom:0;
  width:6px;
  background:var(--tile-accent);
}
.band-tile:active{transform:scale(0.99);}
.band-tile-title{
  font-family:var(--font-display);
  font-weight:700;
  font-size:1.15rem;
  color:var(--tile-accent);
}
.band-tile-sub{
  font-size:.8rem;
  color:var(--ink-soft);
  margin-top:2px;
}
.band-tile-meta{
  font-family:var(--font-mono);
  font-size:.68rem;
  color:var(--ink-faint);
  margin-top:6px;
}
.band-ring{
  flex:none;
  width:50px;height:50px;
  position:relative;
}
.band-ring svg{width:100%;height:100%;transform:rotate(-90deg);}
.band-ring-pct{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);
  font-size:.68rem;
  font-weight:600;
  color:var(--tile-accent);
}

/* ---------- Group grid ---------- */
.group-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:9px;
  padding:16px;
}
.group-cell{
  aspect-ratio:1/1.06;
  border-radius:12px;
  border:1px solid var(--line);
  background:var(--card-alt);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  cursor:pointer;
  color:inherit;
  position:relative;
}
.group-cell:active{transform:scale(0.95);}
.group-cell.is-done{
  background:var(--accent);
  border-color:var(--accent);
}
.group-cell.is-done .group-num,.group-cell.is-done .group-score{color:var(--card);}
.group-num{
  font-family:var(--font-mono);
  font-weight:600;
  font-size:1rem;
}
.group-score{
  font-family:var(--font-mono);
  font-size:.6rem;
  color:var(--ink-faint);
}

/* ---------- Group detail ---------- */
.action-row{
  display:flex;
  gap:10px;
  padding:16px 18px 6px;
}
.action-btn{
  flex:1;
  border:none;
  border-radius:14px;
  background:var(--accent);
  color:var(--card);
  padding:16px 10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  cursor:pointer;
  font-size:.85rem;
  font-weight:600;
}
.action-btn:active{transform:scale(0.97);}
.action-btn svg{width:22px;height:22px;}
.action-btn.secondary{
  background:var(--accent-tint);
  color:var(--accent-ink);
}

.section-label{
  font-family:var(--font-mono);
  font-size:.7rem;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--ink-faint);
  padding:18px 18px 6px;
}
.word-row{
  display:flex;
  align-items:flex-start;
  gap:12px;
  padding:11px 18px;
  border-bottom:1px solid var(--line-soft);
}
.word-row .speak-btn{
  flex:none;
  margin-top:1px;
}
.word-row-main{flex:1;min-width:0;}
.word-row-word{
  font-family:var(--font-display);
  font-weight:600;
  font-size:1.02rem;
}
.word-row-pos{
  font-size:.8rem;
  color:var(--ink-soft);
  margin-top:2px;
}
.word-row-check{
  flex:none;
  color:var(--good);
  margin-top:2px;
}
.speak-btn{
  width:30px;height:30px;
  border-radius:50%;
  border:1px solid var(--line);
  background:var(--card);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  color:var(--accent);
}
.speak-btn svg{width:14px;height:14px;}
.speak-btn:active{transform:scale(0.92);}

/* ---------- Progress bar ---------- */
.progressbar{
  height:5px;
  background:var(--line-soft);
  margin:0 18px;
  border-radius:3px;
  overflow:hidden;
}
.progressbar-fill{
  height:100%;
  background:var(--accent);
  border-radius:3px;
  transition:width .25s ease;
}
.progress-caption{
  padding:10px 18px 0;
  font-family:var(--font-mono);
  font-size:.72rem;
  color:var(--ink-faint);
  text-align:center;
}

/* ---------- Flashcard ---------- */
.card-stage{
  flex:1;
  display:flex;
  flex-direction:column;
  padding:14px 18px 0;
  min-height:0;
}
.flashcard{
  flex:1;
  border-radius:20px;
  border:1px solid var(--line);
  background:var(--card-alt);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:28px 22px;
  cursor:pointer;
  position:relative;
  min-height:280px;
}
.flashcard-tag{
  position:absolute;
  top:14px;left:14px;
  font-family:var(--font-mono);
  font-size:.68rem;
  color:var(--ink-faint);
}
.flashcard-word{
  font-family:var(--font-display);
  font-weight:700;
  font-size:2.35rem;
  line-height:1.1;
  word-break:break-word;
}
.flashcard-pos{
  margin-top:10px;
  font-family:var(--font-mono);
  font-size:.82rem;
  color:var(--accent);
}
.flashcard-hint{
  margin-top:18px;
  font-size:.76rem;
  color:var(--ink-faint);
}
.flashcard.is-flipped{
  align-items:stretch;
  text-align:left;
  justify-content:flex-start;
  overflow-y:auto;
  cursor:pointer;
}
.flashcard-back-word{
  font-family:var(--font-display);
  font-weight:700;
  font-size:1.5rem;
}
.meaning-row{
  display:flex;
  gap:8px;
  margin-top:10px;
  font-size:.92rem;
}
.meaning-pos{
  font-family:var(--font-mono);
  color:var(--accent);
  flex:none;
}
.hr{
  height:1px;
  background:var(--line);
  margin:16px 0;
  border:none;
}
.sentence-en{font-size:.95rem;line-height:1.55;}
.sentence-zh{font-size:.85rem;color:var(--ink-soft);margin-top:6px;line-height:1.6;}

.card-controls{
  display:flex;
  align-items:center;
  gap:10px;
  padding:16px 18px;
  flex:none;
}
.ctrl-btn{
  border:1px solid var(--line);
  background:var(--card-alt);
  border-radius:12px;
  padding:10px 14px;
  font-size:.82rem;
  font-weight:600;
  display:flex;
  align-items:center;
  gap:6px;
  cursor:pointer;
  color:var(--ink);
}
.ctrl-btn[disabled]{opacity:.35;cursor:default;}
.ctrl-btn.grow{flex:1;justify-content:center;}
.ctrl-btn.on{
  background:var(--good-tint);
  color:var(--good);
  border-color:transparent;
}
.ctrl-btn.speak{color:var(--accent);}
.ctrl-btn svg{width:15px;height:15px;}
.card-counter{
  font-family:var(--font-mono);
  font-size:.78rem;
  color:var(--ink-faint);
  flex:none;
  min-width:44px;
  text-align:center;
}

/* ---------- Quiz ---------- */
.quiz-q{
  padding:20px 18px 6px;
  text-align:center;
}
.quiz-instruction{
  font-size:.82rem;
  color:var(--ink-soft);
  margin-top:8px;
}
.quiz-word{
  font-family:var(--font-display);
  font-weight:700;
  font-size:2.1rem;
  display:inline-flex;
  align-items:center;
  gap:10px;
}
.quiz-meaning{
  font-family:var(--font-display);
  font-weight:600;
  font-size:1.35rem;
  line-height:1.4;
}
.quiz-options{
  display:flex;
  flex-direction:column;
  gap:10px;
  padding:18px 18px 6px;
}
.option-btn{
  text-align:left;
  border:1px solid var(--line);
  background:var(--card-alt);
  border-radius:12px;
  padding:14px 16px;
  font-size:.94rem;
  cursor:pointer;
  color:var(--ink);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.option-btn svg{width:18px;height:18px;flex:none;}
.option-btn.correct{background:var(--good-tint);border-color:var(--good);color:var(--good);}
.option-btn.wrong{background:var(--bad-tint);border-color:var(--bad);color:var(--bad);}
.option-btn[disabled]{cursor:default;}

.quiz-next{
  margin:16px 18px;
  padding:15px;
  border:none;
  border-radius:14px;
  background:var(--accent);
  color:var(--card);
  font-weight:700;
  font-size:.95rem;
  cursor:pointer;
}
.quiz-next:active{transform:scale(0.98);}

/* ---------- Results ---------- */
.result-hero{
  text-align:center;
  padding:26px 18px 8px;
}
.result-score{
  font-family:var(--font-mono);
  font-weight:600;
  font-size:3rem;
  color:var(--accent);
  font-variant-numeric:tabular-nums;
}
.result-caption{
  margin-top:6px;
  font-size:.88rem;
  color:var(--ink-soft);
}
.result-row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 18px;
  border-bottom:1px solid var(--line-soft);
}
.result-row svg{width:16px;height:16px;flex:none;}
.result-row.ok svg{color:var(--good);}
.result-row.no svg{color:var(--bad);}
.result-row-word{font-family:var(--font-display);font-weight:600;font-size:.92rem;}
.result-row-answer{font-size:.76rem;color:var(--ink-faint);}
.result-actions{
  display:flex;
  gap:10px;
  padding:16px 18px 20px;
}
.result-actions .action-btn{padding:14px 10px;font-size:.82rem;flex-direction:row;}

.empty-note{
  padding:40px 24px;
  text-align:center;
  color:var(--ink-faint);
  font-size:.85rem;
}

/* ---------- Backup (export / import) ---------- */
.backup-section{
  padding:20px 18px 32px;
  border-top:1px solid var(--line-soft);
  margin-top:8px;
}
.backup-title{
  font-family:var(--font-mono);
  font-size:.7rem;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--ink-faint);
}
.backup-note{
  font-size:.78rem;
  color:var(--ink-faint);
  line-height:1.6;
  margin:6px 0 12px;
}
.backup-row{
  display:flex;
  gap:10px;
}
.backup-row .ctrl-btn{
  padding:12px 10px;
  justify-content:center;
}

/* ---------- Toast ---------- */
.toast{
  position:fixed;
  left:50%;
  bottom:28px;
  transform:translateX(-50%) translateY(12px);
  background:var(--ink);
  color:var(--card);
  padding:10px 18px;
  border-radius:999px;
  font-size:.82rem;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s ease, transform .2s ease;
  z-index:50;
  max-width:80vw;
  text-align:center;
  box-shadow:0 8px 24px -8px var(--shadow);
}
.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;}
}

  function groupWords(bandId, groupIndex) { return byPage[pageForGroup(bandId, groupIndex)] || []; }
  function meaningText(w) { return w.pos.map(p => p.meanings.join('；')).join('；'); }
  function posSummary(w) { return w.pos.map(p => `(${p.pos}) ${p.meanings.join('；')}`).join('  '); }

  // ---------- persistence ----------
  const LS_LEARNED = 'vocabweb.learned';
  const LS_QUIZ = 'vocabweb.quiz';
  let learned = new Set();
  let quizResults = {};
  try { learned = new Set(JSON.parse(localStorage.getItem(LS_LEARNED) || '[]')); } catch (e) {}
  try { quizResults = JSON.parse(localStorage.getItem(LS_QUIZ) || '{}'); } catch (e) {}

  function saveLearned() { try { localStorage.setItem(LS_LEARNED, JSON.stringify([...learned])); } catch (e) {} }
  function saveQuiz() { try { localStorage.setItem(LS_QUIZ, JSON.stringify(quizResults)); } catch (e) {} }

  function isLearned(id) { return learned.has(id); }
  function toggleLearned(id) {
    if (learned.has(id)) learned.delete(id); else learned.add(id);
    saveLearned();
  }
  function learnedCountForBand(bandId) {
    return (byBand[bandId] || []).filter(w => learned.has(w.id)).length;
  }
  function learnedCountForPage(page) {
    return (byPage[page] || []).filter(w => learned.has(w.id)).length;
  }
  function quizKey(bandId, groupIndex) { return bandId + '_' + groupIndex; }
  function getQuizResult(bandId, groupIndex) { return quizResults[quizKey(bandId, groupIndex)]; }
  function recordQuiz(bandId, groupIndex, score) {
    const k = quizKey(bandId, groupIndex);
    const prev = quizResults[k] || { best: 0, attempts: 0 };
    quizResults[k] = { best: Math.max(prev.best, score), attempts: prev.attempts + 1 };
    saveQuiz();
  }

  // ---------- speech ----------
  function speak(text, lang) {
    lang = lang || 'en-US';
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    u.rate = 0.95;
    window.speechSynthesis.speak(u);
  }

  // ---------- navigation ----------
  const stack = [{ screen: 'home' }];
  function current() { return stack[stack.length - 1]; }
  function push(state) { stack.push(state); render(); app.scrollTop = 0; }
  function back() { if (stack.length > 1) { stack.pop(); render(); } }
  function replaceTop(state) { stack[stack.length - 1] = state; render(); }

  function setAccent(bandId) {
    const b = bandId ? bandInfo(bandId) : BANDS[0];
    app.style.setProperty('--accent', `var(${b.accent})`);
    app.style.setProperty('--accent-tint', `var(${b.tint})`);
    app.style.setProperty('--accent-ink', `var(${b.ink})`);
    document.querySelectorAll('.deck-shadow').forEach(el => {
      el.style.background = `var(${b.tint})`;
    });
  }

  // ---------- icons ----------
  const ICONS = {
    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
    speak: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
    checkFilled: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm-1.2 14.4-4-4 1.4-1.4 2.6 2.6 5.6-5.6 1.4 1.4-7 7Z"/></svg>',
    cross: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
    cards: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="14" height="14" rx="2"/><path d="M7 7V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-2"/></svg>',
    quiz: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.5-2 1.8-2 3.3"/><circle cx="12" cy="16.3" r=".4" fill="currentColor"/></svg>',
    chevL: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
    chevR: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
    download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></svg>',
    upload: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V9"/><path d="M7 13l5-5 5 5"/><path d="M5 20h14"/></svg>',
  };

  function ringSvg(pct, colorVar) {
    const r = 20, c = 2 * Math.PI * r;
    const off = c * (1 - pct);
    return `<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="${r}" fill="none" stroke="var(${colorVar})" stroke-opacity="0.18" stroke-width="5"/><circle cx="24" cy="24" r="${r}" fill="none" stroke="var(${colorVar})" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>`;
  }

  function esc(str) {
    return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  }

  let toastTimer = null;
  function showToast(msg) {
    let el = document.getElementById('toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'toast';
      el.className = 'toast';
      document.querySelector('.stage').appendChild(el);
    }
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
  }

  // ---------- backup: export / import ----------
  function exportProgress() {
    const payload = {
      app: 'vocabweb',
      version: 1,
      exportedAt: new Date().toISOString(),
      learned: [...learned],
      quiz: quizResults,
    };
    const json = JSON.stringify(payload, null, 2);
    const filename = 'vocab-progress-' + new Date().toISOString().slice(0, 10) + '.json';
    if (window.claude && window.claude.downloads) {
      window.claude.downloads.save({ filename, data: json })
        .then(() => showToast('已匯出備份'))
        .catch(err => {
          if (err && err.code === 'declined') return;
          showToast('匯出失敗，請再試一次');
        });
    } else {
      try {
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
        showToast('已匯出備份');
      } catch (e) {
        showToast('匯出失敗，請再試一次');
      }
    }
  }

  function importProgressFromFile(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const payload = JSON.parse(reader.result);
        const importedLearned = Array.isArray(payload.learned) ? payload.learned : [];
        const importedQuiz = payload.quiz && typeof payload.quiz === 'object' ? payload.quiz : {};
        importedLearned.forEach(id => learned.add(id));
        Object.keys(importedQuiz).forEach(k => {
          const prev = quizResults[k] || { best: 0, attempts: 0 };
          const inc = importedQuiz[k] || { best: 0, attempts: 0 };
          quizResults[k] = { best: Math.max(prev.best, inc.best || 0), attempts: prev.attempts + (inc.attempts || 0) };
        });
        saveLearned();
        saveQuiz();
        showToast('已匯入備份');
        render();
      } catch (e) {
        showToast('這個檔案無法匯入');
      }
    };
    reader.onerror = () => showToast('讀取檔案失敗');
    reader.readAsText(file);
  }

  // ---------- render ----------
  const app = document.getElementById('app');

  function render() {
    const s = current();
    setAccent(s.band || null);
    let html = '';
    if (s.screen === 'home') html = renderHome();
    else if (s.screen === 'groups') html = renderGroups(s.band);
    else if (s.screen === 'group') html = renderGroupDetail(s.band, s.group);
    else if (s.screen === 'study') html = renderStudy(s.band, s.group, s.index || 0, !!s.flipped);
    else if (s.screen === 'quiz') html = renderQuiz(s);
    app.innerHTML = html;
    bindEvents(s);
  }

  function topbar(title, sub, showBack) {
    return `<div class="topbar">
      ${showBack ? `<button class="iconbtn" data-action="back" aria-label="返回">${ICONS.back}</button>` : ''}
      <div>
        <div class="topbar-title">${esc(title)}</div>
        ${sub ? `<div class="topbar-sub">${esc(sub)}</div>` : ''}
      </div>
      <div class="spacer"></div>
    </div>`;
  }

  function renderHome() {
    const rows = BANDS.map(b => {
      const total = GROUPS_PER_BAND * WORDS_PER_GROUP;
      const c = learnedCountForBand(b.id);
      const pct = total ? c / total : 0;
      return `<button class="band-tile" data-action="open-band" data-band="${b.id}" style="--tile-accent:var(${b.accent})">
        <div style="flex:1;min-width:0;">
          <div class="band-tile-title">${esc(b.title)}</div>
          <div class="band-tile-sub">${esc(b.sub)}</div>
          <div class="band-tile-meta">已學 ${c}/${total} 字 · ${GROUPS_PER_BAND} 組</div>
        </div>
        <div class="band-ring">${ringSvg(pct, b.accent)}<div class="band-ring-pct" style="color:var(${b.accent})">${Math.round(pct * 100)}%</div></div>
      </button>`;
    }).join('');
    return `${topbar('字卡抽屜', 'TOEIC · 1000 WORDS', false)}
    <div class="screen">
      <div class="home-hero">
        <div class="home-kicker">挑選你的目標分數</div>
        <div class="home-title">多益 1000 字</div>
        <div class="home-desc">依 400 / 600 / 800 / 990 分級距分組，每組 10 字，可學習、朗讀、測驗。</div>
      </div>
      <div class="band-list">${rows}</div>
      <div class="backup-section">
        <div class="backup-title">備份進度</div>
        <div class="backup-note">此裝置的進度存在瀏覽器裡，換裝置或清除瀏覽資料會消失。建議不定期「匯出備份」存成檔案，需要時再「匯入備份」還原。</div>
        <div class="backup-row">
          <button class="ctrl-btn grow" data-action="export-progress">${ICONS.download} 匯出備份</button>
          <button class="ctrl-btn grow" data-action="import-progress">${ICONS.upload} 匯入備份</button>
        </div>
        <input type="file" id="import-input" accept="application/json" style="display:none;">
      </div>
    </div>`;
  }

  function renderGroups(bandId) {
    const b = bandInfo(bandId);
    const cells = [];
    for (let g = 1; g <= GROUPS_PER_BAND; g++) {
      const page = pageForGroup(bandId, g);
      const c = learnedCountForPage(page);
      const qr = getQuizResult(bandId, g);
      const done = c === WORDS_PER_GROUP;
      cells.push(`<button class="group-cell ${done ? 'is-done' : ''}" data-action="open-group" data-group="${g}">
        <div class="group-num">${g}</div>
        <div class="group-score">${qr ? qr.best + '/10' : c + '/10'}</div>
      </button>`);
    }
    return `${topbar(b.title, b.sub, true)}
    <div class="screen">
      <div class="group-grid">${cells.join('')}</div>
    </div>`;
  }

  function renderGroupDetail(bandId, group) {
    const b = bandInfo(bandId);
    const words = groupWords(bandId, group);
    const rows = words.map(w => `
      <div class="word-row">
        <button class="speak-btn" data-action="speak" data-text="${esc(w.word)}" aria-label="發音">${ICONS.speak}</button>
        <div class="word-row-main">
          <div class="word-row-word">${esc(w.word)}</div>
          <div class="word-row-pos">${esc(posSummary(w))}</div>
        </div>
        ${isLearned(w.id) ? `<div class="word-row-check">${ICONS.checkFilled}</div>` : ''}
      </div>`).join('');
    return `${topbar(`第 ${group} 組`, b.title, true)}
    <div class="screen">
      <div class="action-row">
        <button class="action-btn" data-action="open-study">${ICONS.cards}開始學習</button>
        <button class="action-btn secondary" data-action="open-quiz">${ICONS.quiz}單字測驗</button>
      </div>
      <div class="section-label">本組單字 · ${words.length}</div>
      ${rows}
    </div>`;
  }

  function renderStudy(bandId, group, index, flipped) {
    const b = bandInfo(bandId);
    const words = groupWords(bandId, group);
    const w = words[index];
    const pct = (index + 1) / words.length;
    const front = `
      <div class="flashcard-tag">${esc(b.title)} · 第 ${group} 組</div>
      <div class="flashcard-word">${esc(w.word)}</div>
      <div class="flashcard-pos">${esc(w.pos.map(p => p.pos).join(', '))}</div>
      <div class="flashcard-hint">點一下卡片看解釋</div>`;
    const back = `
      <div class="flashcard-back-word">${esc(w.word)}</div>
      ${w.pos.map(p => `<div class="meaning-row"><span class="meaning-pos">(${esc(p.pos)})</span><span>${esc(p.meanings.join('；'))}</span></div>`).join('')}
      <hr class="hr"/>
      <div class="sentence-en">${esc(w.sentence)}</div>
      <div class="sentence-zh">${esc(w.translation)}</div>`;
    return `${topbar(`第 ${group} 組 · 學習`, b.title, true)}
    <div class="progressbar"><div class="progressbar-fill" style="width:${pct * 100}%"></div></div>
    <div class="card-stage">
      <div class="flashcard ${flipped ? 'is-flipped' : ''}" data-action="flip">
        ${flipped ? back : front}
      </div>
    </div>
    <div class="card-controls">
      <button class="ctrl-btn ${isLearned(w.id) ? 'on' : ''}" data-action="toggle-learned">${ICONS.check} ${isLearned(w.id) ? '已熟記' : '標記熟記'}</button>
      <button class="ctrl-btn speak" data-action="speak-card">${ICONS.speak} 發音</button>
    </div>
    <div class="card-controls" style="padding-top:0;">
      <button class="ctrl-btn" data-action="prev" ${index === 0 ? 'disabled' : ''} aria-label="上一個">${ICONS.chevL}</button>
      <div class="card-counter">${index + 1} / ${words.length}</div>
      <button class="ctrl-btn grow" data-action="next-card">${index === words.length - 1 ? '完成 → 去測驗' : '下一個'} ${ICONS.chevR}</button>
    </div>`;
  }

  function buildQuiz(bandId, group) {
    const words = groupWords(bandId, group);
    const pool = byBand[bandId] || [];
    return words.map(w => {
      const kind = Math.random() < 0.5 ? 'w2m' : 'm2w';
      const distractors = pool.filter(x => x.id !== w.id).sort(() => Math.random() - 0.5).slice(0, 3);
      let options, correctIndex;
      if (kind === 'w2m') {
        options = distractors.map(d => meaningText(d));
        correctIndex = Math.floor(Math.random() * (options.length + 1));
        options.splice(correctIndex, 0, meaningText(w));
      } else {
        options = distractors.map(d => d.word);
        correctIndex = Math.floor(Math.random() * (options.length + 1));
        options.splice(correctIndex, 0, w.word);
      }
      return { word: w, kind, options, correctIndex };
    });
  }

  function renderQuiz(s) {
    const b = bandInfo(s.band);
    if (!s.questions) {
      s.questions = buildQuiz(s.band, s.group);
      s.qIndex = 0;
      s.answers = [];
      s.selected = null;
      s.finished = false;
    }
    if (s.finished) return renderQuizResult(s);

    const q = s.questions[s.qIndex];
    const selected = s.selected;
    const body = q.kind === 'w2m' ? `
      <div class="quiz-word">${esc(q.word.word)} <button class="speak-btn" data-action="speak" data-text="${esc(q.word.word)}" aria-label="發音">${ICONS.speak}</button></div>
      <div class="quiz-instruction">請選出正確的中文意思</div>`
      : `
      <div class="quiz-meaning">${esc(meaningText(q.word))}</div>
      <div class="quiz-instruction">請選出正確的英文單字</div>`;
    const options = q.options.map((opt, i) => {
      let cls = '', icon = '';
      if (selected !== null) {
        if (i === q.correctIndex) { cls = 'correct'; icon = ICONS.check; }
        else if (i === selected) { cls = 'wrong'; icon = ICONS.cross; }
      }
      return `<button class="option-btn ${cls}" data-action="answer" data-index="${i}" ${selected !== null ? 'disabled' : ''}>
        <span>${esc(opt)}</span>${icon}
      </button>`;
    }).join('');
    return `${topbar(`第 ${s.group} 組 · 測驗`, b.title, true)}
    <div class="progressbar"><div class="progressbar-fill" style="width:${s.qIndex / s.questions.length * 100}%"></div></div>
    <div class="progress-caption">第 ${s.qIndex + 1} / ${s.questions.length} 題</div>
    <div class="screen">
      <div class="quiz-q">${body}</div>
      <div class="quiz-options">${options}</div>
      ${selected !== null ? `<button class="quiz-next" data-action="quiz-next">${s.qIndex === s.questions.length - 1 ? '完成測驗' : '下一題'}</button>` : ''}
    </div>`;
  }

  function renderQuizResult(s) {
    const b = bandInfo(s.band);
    const score = s.answers.filter(a => a.correct).length;
    const rows = s.answers.map(a => `
      <div class="result-row ${a.correct ? 'ok' : 'no'}">
        ${a.correct ? ICONS.checkFilled : ICONS.cross}
        <div style="flex:1;min-width:0;">
          <div class="result-row-word">${esc(a.word.word)}</div>
          <div class="result-row-answer">${esc(a.correctText)}</div>
        </div>
      </div>`).join('');
    return `${topbar(`第 ${s.group} 組 · 結果`, b.title, true)}
    <div class="screen">
      <div class="result-hero">
        <div class="result-score">${score}<span style="font-size:1.4rem;color:var(--ink-faint);">/${s.answers.length}</span></div>
        <div class="result-caption">${score === s.answers.length ? '太棒了，全部答對！' : '再複習一下答錯的單字吧'}</div>
      </div>
      ${rows}
      <div class="result-actions">
        <button class="action-btn secondary" data-action="quiz-retry">再測一次</button>
        <button class="action-btn" data-action="quiz-done">返回本組</button>
      </div>
    </div>`;
  }

  // ---------- events ----------
  function bindEvents(s) {
    app.querySelectorAll('[data-action]').forEach(el => {
      el.addEventListener('click', () => handleAction(el.getAttribute('data-action'), el, s));
    });
    const importInput = document.getElementById('import-input');
    if (importInput) {
      importInput.addEventListener('change', () => {
        if (importInput.files && importInput.files[0]) importProgressFromFile(importInput.files[0]);
        importInput.value = '';
      });
    }
  }

  function handleAction(action, el, s) {
    switch (action) {
      case 'back': back(); break;
      case 'open-band': push({ screen: 'groups', band: Number(el.dataset.band) }); break;
      case 'open-group': push({ screen: 'group', band: s.band, group: Number(el.dataset.group) }); break;
      case 'open-study': push({ screen: 'study', band: s.band, group: s.group, index: 0, flipped: false }); break;
      case 'open-quiz': push({ screen: 'quiz', band: s.band, group: s.group }); break;
      case 'speak': speak(el.dataset.text); break;
      case 'export-progress': exportProgress(); break;
      case 'import-progress': { const inp = document.getElementById('import-input'); if (inp) inp.click(); break; }
      case 'flip': s.flipped = !s.flipped; render(); break;
      case 'toggle-learned': {
        const words = groupWords(s.band, s.group);
        toggleLearned(words[s.index].id);
        render();
        break;
      }
      case 'speak-card': {
        const words = groupWords(s.band, s.group);
        const w = words[s.index];
        speak(s.flipped ? w.sentence : w.word);
        break;
      }
      case 'prev':
        if (s.index > 0) { s.index--; s.flipped = false; render(); }
        break;
      case 'next-card': {
        const words = groupWords(s.band, s.group);
        if (s.index < words.length - 1) { s.index++; s.flipped = false; render(); }
        else { replaceTop({ screen: 'quiz', band: s.band, group: s.group }); }
        break;
      }
      case 'answer': {
        const q = s.questions[s.qIndex];
        const idx = Number(el.dataset.index);
        s.selected = idx;
        const correct = idx === q.correctIndex;
        const correctText = q.kind === 'w2m' ? meaningText(q.word) : q.word.word;
        s.answers.push({ word: q.word, correct, correctText });
        speak(q.word.word);
        render();
        break;
      }
      case 'quiz-next':
        if (s.qIndex < s.questions.length - 1) { s.qIndex++; s.selected = null; render(); }
        else {
          s.finished = true;
          recordQuiz(s.band, s.group, s.answers.filter(a => a.correct).length);
          render();
        }
        break;
      case 'quiz-retry': replaceTop({ screen: 'quiz', band: s.band, group: s.group }); break;
      case 'quiz-done': back(); break;
    }
  }

  render();
})();

</script>
